<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pic Expert 任务页面</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="details-page">
    <header class="details-header">
      <div class="header-inner">
        <div class="header-left">
          <img class="site-logo-large" src="logo.png" alt="银联商务">
          <div class="header-divider"></div>
          <h1>订单资料下载控制台</h1>
          <span id="export-target" class="target-badge">商户统一服务平台</span>
        </div>
      </div>
    </header>

    <main class="prepare-content">
      <div id="interruption" class="interruption export-result export-result-stopped" role="alert" hidden></div>
      <div id="completion" class="completion export-result export-result-success" role="status" aria-live="polite" hidden></div>
      <p id="error" class="error-message" role="alert"></p>

      <section class="overview-card" aria-live="polite">
        <div class="card-header card-header-flex">
          <div class="overview-status-line">
            <strong id="status" class="status-badge-lg">未开始</strong>
            <span id="status-badge" class="gate-badge">待命</span>
          </div>
          <div class="task-actions details-actions">
            <button id="start" class="primary-button" type="button">开始下载</button>
            <button id="pause" class="secondary-button" type="button" hidden>暂停任务</button>
            <button id="resume" class="primary-button" type="button" hidden>继续上次任务</button>
            <button id="stop" class="danger-button" type="button" hidden>停止任务</button>
            <button id="retry" class="secondary-button" type="button" hidden>重试下载清单</button>
          </div>
        </div>

        <div class="stage-callout">
          <label for="business" class="stage-label">导出功能：</label>
          <select id="business" class="console-select">
            <option value="appliance">家电电脑资料导出</option>
            <option value="digital">数码资料导出</option>
          </select>
        </div>

        <div class="stage-callout">
          <span class="stage-label">当前步骤：</span>
          <span id="progress" class="stage-text"></span>
        </div>

        <div class="progress-section">
          <div class="progress-col">
            <div class="progress-meta">
              <span class="progress-title">处理进度</span>
              <span id="progress-percent" class="progress-num">0%</span>
            </div>
            <div class="progress-bar-bg">
              <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%"></div>
            </div>
          </div>
        </div>

        <div class="months-subcard">
          <div class="months-header-compact">
            <span class="months-title">订单统计看板</span>
          </div>
          <div class="months-grid stats-grid">
            <div class="month-card stat-card">
              <span class="detail-label">订单总数</span>
              <strong id="stat-total" class="progress-num">-</strong>
            </div>
            <div class="month-card stat-card">
              <span class="detail-label">成功</span>
              <strong id="stat-completed" class="progress-num status-positive">-</strong>
            </div>
            <div class="month-card stat-card">
              <span class="detail-label">跳过</span>
              <strong id="stat-skipped" class="progress-num status-warning">-</strong>
            </div>
            <div class="month-card stat-card">
              <span class="detail-label">失败</span>
              <strong id="stat-failed" class="progress-num status-negative">-</strong>
            </div>
          </div>
        </div>
      </section>

      <section class="overview-card log-card">
        <div class="card-header card-header-flex">
          <h2>运行日志（最近 500 条）</h2>
          <div class="details-actions log-actions">
            <button id="copy-logs" class="secondary-button copy-button" type="button" disabled>复制日志</button>
            <button id="export-logs" class="secondary-button copy-button" type="button" disabled>导出完整日志</button>
            <span id="copy-status" role="status"></span>
          </div>
        </div>
        <textarea id="logs" class="prepare-log" rows="12" readonly aria-label="运行日志"></textarea>
      </section>

      <div class="privacy-note">
        <p>运行期间请保留银联商务页面和此控制台。来源网页刷新、跳转或关闭后，任务自动暂停；恢复原查询后可继续。</p>
        <details>
          <summary>查看开始前确认与导出规则</summary>
          <ol class="guide-steps">
            <li><strong>登录对应账号</strong>：打开网站订单页面，使用所选功能对应的账号。</li>
            <li><strong>设置查询范围</strong>：交易日期必填，订单状态留空表示全部。其他筛选项不参与下载范围。</li>
            <li><strong>查询后开始下载</strong>：先读取完整订单列表，再下载图片并生成清单。</li>
          </ol>
        </details>
      </div>
    </main>

    <script src="page-core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
